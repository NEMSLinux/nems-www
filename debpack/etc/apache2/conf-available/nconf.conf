# =========================================================================
# NConf Apache Configuration
# =========================================================================

# Map /nconf URL path to the physical directory on disk
# This replaces the old <= NEMS 1.7 symlink method
Alias /nconf /var/www/nconf

<Directory /var/www/nconf>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
</Directory>

# Hardening: Deny direct HTTP access to configuration and binary directories
<Directory /var/www/nconf/config>
    Require all denied
</Directory>

<Directory /var/www/nconf/bin>
    Require all denied
</Directory>

# Enforce NEMS SSO Authentication & Authorization (Admin level or higher)
<Location /nconf>
    LuaHookAccessChecker /etc/apache2/nems_sso.lua nems_require_admin
</Location>
